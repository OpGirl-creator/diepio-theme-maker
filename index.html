<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diep.io Theme Maker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="main-title">Diep.io Theme Maker</h1>

    <div class="workspace">
        <!-- LEFT SIDEBAR: GAMEMODES -->
        <div class="sidebar gamemodes">
            <h2>Gamemodes</h2>
            <button class="mode-btn" data-mode="ffa" style="background-color: #2be6de;">FFA</button>
            <button class="mode-btn" data-mode="teams2" style="background-color: #85e333;">2 Teams</button>
            <button class="mode-btn" data-mode="teams4" style="background-color: #f05151;">4 Teams</button>
            <button class="mode-btn" data-mode="maze" style="background-color: #f1b832;">Maze</button>
            <button class="mode-btn" data-mode="ctf" style="background-color: #3b74e6;">Capture the Flag</button>
            <button class="mode-btn" data-mode="maze" style="background-color: #f1b832;">Domination</button>
        </div>

        <!-- CENTER: LIVE CANVAS PREVIEW -->
        <div class="preview-container">
            <canvas id="gameCanvas" width="700" height="400"></canvas>
        </div>

        <!-- RIGHT SIDEBAR: OPTIONS -->
        <div class="sidebar options">
            <h2>Other options</h2>
            <button id="viewCodeBtn">view code</button>
            <button id="copyCodeBtn">copy code</button>
            <textarea id="codeOutput" readonly placeholder="Your theme script will appear here..."></textarea>
        </div>
    </div>

    <!-- BOTTOM CONTROL PANEL FOR COLORS -->
    <div class="control-panel">
        <div class="control-group">
            <h3>object colors</h3>
            <div class="color-picker-row"><input type="color" id="colorBarrel" value="#999999"><label>Tanks</label></div>
            <div class="color-picker-row"><input type="color" id="colorBody" value="#00b2e1"><label>TDM</label></div>
            <div class="color-picker-row"><input type="color" id="colorOutline" value="#555555"><label>Shadow Outline</label></div>
            <div class="color-picker-row"><input type="color" id="colorOutline" value="#555555"><label>Polygons</label></div>
            <div class="color-picker-row"><input type="color" id="colorOutline" value="#555555"><label>Background (BG)</label></div>
            <div class="color-picker-row"><input type="color" id="colorOutline" value="#555555"><label>Score/XP/Minimap</label></div>
            <div class="color-picker-row"><input type="color" id="colorOutline" value="#555555"><label>UI Colors</label></div>
        </div>

        <div class="control-group">
            <h3>environment</h3>
            <div class="color-picker-row"><input type="color" id="colorBackground" value="#cdcdcd"><label>Canvas BG</label></div>
            <div class="color-picker-row"><input type="color" id="colorGrid" value="#b5b5b5"><label>Grid Line</label></div>
            <div class="color-picker-row"><input type="color" id="colorSquare" value="#ffe869"><label>Square Shape</label></div>
            <div class="color-picker-row"><input type="color" id="colorTriangle" value="#fc7676"><label>Triangle Shape</label></div>
            <div class="color-picker-row"><input type="color" id="colorPentagon" value="#768cfc"><label>Pentagon Shape</label></div>
        </div>

        <div class="control-group">
            <h3>Team Adjustments</h3>
            <div class="color-picker-row"><input type="color" id="colorBlue" value="#00b2e1"><label>Blue Team color</label></div>
            <div class="color-picker-row"><input type="color" id="colorRed" value="#f14e54"><label>Red Team color</label></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
