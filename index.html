<!-- Gamemode Buttons -->
<button id="btnFFA" class="mode-btn active">FFA</button>
<button id="btnTDM" class="mode-btn">2 Teams</button>

<!-- Canvas Preview -->
<canvas id="gameCanvas" width="600" height="400"></canvas>

<!-- Tanks Color Pickers -->
<div class="control-group">
    <h3>Tanks</h3>
    <div class="color-picker-row">
        <input type="color" id="colorMainBody" value="#00b2e1">
        <label>Main Body</label>
    </div>
    <div class="color-picker-row">
        <input type="color" id="colorBarrels" value="#999999">
        <label>Barrels</label>
    </div>
    <div class="color-picker-row">
        <input type="color" id="colorFFAEnemy" value="#f14e54">
        <label>FFA Enemy</label>
    </div>
    <div class="color-picker-row">
        <input type="color" id="colorFallenBoss" value="#c3c3c3">
        <label>Fallen Boss</label>
    </div>
</div>
