<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diep.io Theme Maker v1.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="main-title">Diep.io Theme Maker v1.0</h1>
    
    <div class="workspace">
        <!-- LEFT SIDEBAR: GAMEMODES -->
        <div class="sidebar gamemodes">
            <h2>Gamemodes</h2>
            <button class="mode-btn active" data-mode="ffa" style="background-color: #2be6de;">FFA</button>
            <button class="mode-btn" data-mode="teams2" style="background-color: #85e333;">2 Teams</button>
        </div>

        <!-- CENTER: LIVE CANVAS PREVIEW -->
        <div class="preview-container">
            <canvas id="gameCanvas" width="850" height="400"></canvas>
        </div>

        <!-- RIGHT SIDEBAR: THEME OVERVIEW -->
        <div class="sidebar options">
            <h2>Theme Overview</h2>
            <textarea id="codeOutput" readonly placeholder="Your script will appear here..."></textarea>
            <button id="viewCodeBtn">VIEW SCRIPT</button>
            <button id="copyCodeBtn">COPY SCRIPT</button>
        </div>
    </div>

    <!-- BOTTOM CONTROL PANEL: ONLY TANKS CATEGORY -->
    <div class="control-panel">
        <div class="control-group">
            <h3>Tanks</h3>
            <div class="color-picker-row">
                <input type="color" id="main" value="#00b2e1">
                <label>Main Body</label>
            </div>
            <div class="color-picker-row">
                <input type="color" id="barrel" value="#999999">
                <label>Barrels</label>
            </div>
            <div class="color-picker-row">
                <input type="color" id="enemy" value="#f14e54">
                <label>FFA enemy</label>
            </div>
            <div class="color-picker-row">
                <input type="color" id="fallen" value="#999999">
                <label>Fallen Boss</label>
            </div>
            <div class="color-picker-row">
                <input type="color" id="square" value="#ffe869">
                <label>Square</label>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
